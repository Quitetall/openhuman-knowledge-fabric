packages:
  - 'apps/*'
  - 'packages/*'

# Workspace dependencies are COPIED into their dependents, not symlinked.
#
# This is what makes a release tree self-contained, and it was turned on because the first
# real host install proved the tree was not. `pnpm deploy --legacy` writes workspace links
# whose relative depth only holds inside this monorepo:
#
#   packages/operations/node_modules/@kf/database -> ../../../../../../packages/database
#
# Six levels up from the deploy tree at /opt/kf/knowledge-fabric-<id>/ lands on
# /opt/packages/database, which does not exist — and `@kf/database`'s code was never copied
# into the release at all, so the dangling link was the only reference to it. Every process
# depending on a workspace package therefore died at import on the host, including
# `kf-commissioning`, which is the program the whole commissioning procedure runs on.
#
# `docs/deployment/private-host.md` used to call `--legacy` "a packaging mode, not permission
# to change lockfile", declining injection precisely because it moves the lockfile. That
# trade was reasonable while nothing had been installed anywhere; it stopped being reasonable
# when it turned out to be the thing preventing a host from existing. Decided 2026-08-26.
#
# The cost is real and is accepted: injected packages appear in `pnpm-lock.yaml` with their
# own resolution entries, so the lockfile is larger and a workspace package's dependency
# change now touches every dependent's entry.
injectWorkspacePackages: true

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.67.0'
  - '@typescript-eslint/parser@8.67.0'
  - '@typescript-eslint/project-service@8.67.0'
  - '@typescript-eslint/scope-manager@8.67.0'
  - '@typescript-eslint/tsconfig-utils@8.67.0'
  - '@typescript-eslint/type-utils@8.67.0'
  - '@typescript-eslint/types@8.67.0'
  - '@typescript-eslint/typescript-estree@8.67.0'
  - '@typescript-eslint/utils@8.67.0'
  - '@typescript-eslint/visitor-keys@8.67.0'
  - typescript-eslint@8.67.0
  - '@aws-sdk/client-s3@3.1107.0'
  - '@aws-sdk/s3-request-presigner@3.1107.0'

# Transitive build scripts permitted to run, and actually run.
#
# All three arrive under testcontainers, a devDependency, and none reaches production:
# ssh2's optional crypto bindings, cpu-features' CPU detection, protobufjs' post-install
# codegen. Approved rather than declined because refusing them does not reduce exposure —
# the code is in the tree the moment testcontainers is a dependency — while pnpm rightly
# treats an unacknowledged build script as something a human must decide about.
#
# LISTING is not the same as HAVING RUN. A package named here but never built leaves pnpm
# reporting the mismatch on every install, and `pnpm install` exits non-zero, which breaks
# CI's --frozen-lockfile step. `pnpm approve-builds --all` is what reconciles the two.
#
# The list is exhaustive on purpose: a NEW package wanting to run a build script fails the
# install until someone looks at it.
