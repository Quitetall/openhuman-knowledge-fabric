schema = "oh.war/rationale/v1"

# The three residual risks named in atoms/60-assurance.md, as TYPED records.
#
# They were prose only until the authorization request was emitted and read back
# `residual_risks = []`. The authorizer would have been asked to accept risks the request did not
# show them — which is the one thing an authorization request exists to prevent. Prose in the
# assurance atom is for a human reading the Warrant; this file is what the tool puts in front of
# the person signing.

[[assumption]]
id = "A-001"
statement = "One rented VPS, reached over Tailscale with off-site copies in Backblaze B2, is an acceptable first host (ADR 0039). This replaced 'a virtual machine on the build workstation can produce commissioning evidence that means something' when ADR 0039 moved the host off the workstation."
epistemic_status = "accepted_residual_risk"
consequence_if_false = "Every check passes on one machine at one provider, criterion 3 of ADR 0004 reads met, and a failure of the provider's host, the tailnet or B2 is read as covered. ADR 0039 bounds each: the tailnet loses access not data, B2 loses off-site copies not working data, and the provider console is a second way in."
judgment_ref = ""

[[assumption]]
id = "A-002"
statement = "One person acting as technical authority, quality authority and accepting party is acceptable for a dogfood commissioning."
epistemic_status = "accepted_residual_risk"
consequence_if_false = "A mistaken approval has no second reader. ADR 0004 records this and its remedy: move quality authority or cutover acceptance to the second engineer as soon as one exists."
judgment_ref = ""

[[assumption]]
id = "A-003"
statement = "Phase 9 can be resolved while two of its exit conditions remain outside every gate in this repository."
epistemic_status = "accepted_residual_risk"
consequence_if_false = "A person receiving an alert and real-provider browser evidence are carried as open rather than covered. If they are later read as covered because the Warrant resolved, the alert path is untested where it matters and the identity claim rests on a fixture."
judgment_ref = ""
