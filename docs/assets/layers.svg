<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-label="The three layers: workflows, compiler, kernel">
  <rect width="1120" height="640" fill="#16201d"/>

  <!-- Layer 3: workflows -->
  <rect x="60" y="44" width="1000" height="150" fill="#1f2925" stroke="#3a4742" stroke-width="1.5"/>
  <text x="84" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4" fill="#6d8078">LAYER 3</text>
  <text x="84" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#e4ece8">Workflows</text>
  <text x="84" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9fb0a9">Business rules, integrations, and every way a person or an agent reaches the Fabric.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9fb0a9">
    <rect x="84" y="154" width="118" height="26" fill="#2a3531"/><text x="99" y="171">web app</text>
    <rect x="214" y="154" width="118" height="26" fill="#2a3531"/><text x="240" y="171">Slack</text>
    <rect x="344" y="154" width="118" height="26" fill="#2a3531"/><text x="360" y="171">command line</text>
    <rect x="474" y="154" width="118" height="26" fill="#2a3531"/><text x="497" y="171">agents</text>
    <rect x="604" y="154" width="150" height="26" fill="#2a3531"/><text x="619" y="171">CRM, invoicing</text>
  </g>

  <!-- arrow down: calls -->
  <line x1="300" y1="194" x2="300" y2="244" stroke="#0f6b5c" stroke-width="2"/>
  <polygon points="295,244 305,244 300,254" fill="#0f6b5c"/>
  <text x="316" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#4fbfa8">calls the compiler to read</text>

  <line x1="880" y1="254" x2="880" y2="194" stroke="#c8813f" stroke-width="2"/>
  <polygon points="875,194 885,194 880,184" fill="#c8813f"/>
  <text x="612" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c8813f" text-anchor="end">projections come back</text>

  <!-- Layer 2: compiler -->
  <rect x="60" y="258" width="1000" height="150" fill="#1f2925" stroke="#3a4742" stroke-width="1.5"/>
  <text x="84" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4" fill="#6d8078">LAYER 2</text>
  <text x="84" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#e4ece8">Compiler</text>
  <text x="84" y="354" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9fb0a9">Reads the database. Makes a page for a person and a context bundle for an agent.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9fb0a9">
    <rect x="84" y="368" width="150" height="26" fill="#2a3531"/><text x="99" y="385">master record</text>
    <rect x="246" y="368" width="150" height="26" fill="#2a3531"/><text x="275" y="385">projections</text>
    <rect x="408" y="368" width="150" height="26" fill="#2a3531"/><text x="424" y="385">exact by tag</text>
    <rect x="570" y="368" width="200" height="26" fill="#2a3531"/><text x="585" y="385">near misses, on request</text>
  </g>

  <!-- LAMU box -->
  <rect x="820" y="278" width="216" height="112" fill="#26312d" stroke="#4fbfa8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="844" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#4fbfa8">LAMU</text>
  <text x="844" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9fb0a9">The vector store.</text>
  <text x="844" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9fb0a9">Finds near records</text>
  <text x="844" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9fb0a9">for a given P value.</text>

  <!-- arrow down: reads / writes -->
  <line x1="300" y1="408" x2="300" y2="458" stroke="#0f6b5c" stroke-width="2"/>
  <polygon points="295,458 305,458 300,468" fill="#0f6b5c"/>
  <text x="316" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#4fbfa8">reads only</text>

  <line x1="880" y1="408" x2="880" y2="458" stroke="#c8813f" stroke-width="2"/>
  <polygon points="875,458 885,458 880,468" fill="#c8813f"/>
  <text x="864" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c8813f" text-anchor="end">every write is an act</text>

  <!-- Layer 1: kernel -->
  <rect x="60" y="472" width="1000" height="140" fill="#1c2723" stroke="#0f6b5c" stroke-width="2"/>
  <text x="84" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4" fill="#6d8078">LAYER 1</text>
  <text x="84" y="538" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#e4ece8">Kernel</text>
  <text x="84" y="568" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9fb0a9">PostgreSQL holds the rules. One dispatcher is the only way to write.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9fb0a9">
    <rect x="608" y="530" width="140" height="26" fill="#2a3531"/><text x="623" y="547">row security</text>
    <rect x="758" y="530" width="140" height="26" fill="#2a3531"/><text x="781" y="547">151 acts</text>
    <rect x="908" y="530" width="140" height="26" fill="#2a3531"/><text x="924" y="547">audit chain</text>
    <rect x="608" y="566" width="140" height="26" fill="#2a3531"/><text x="637" y="583">artifacts</text>
    <rect x="758" y="566" width="140" height="26" fill="#2a3531"/><text x="781" y="583">clearance</text>
    <rect x="908" y="566" width="140" height="26" fill="#2a3531"/><text x="937" y="583">grants</text>
  </g>
</svg>
