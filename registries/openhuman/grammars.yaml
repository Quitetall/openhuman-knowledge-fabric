# Identifier grammars — OH-DOC-000001-3 R01 §4.1, §9.4, §9.5, §10.1 and Appendix B.1.
#
# The patterns are transcribed from Appendix B.1, which is normative. Appendix B.1 also says,
# in the sentence immediately after them:
#
#   "Regex conformance is necessary but not sufficient; validators shall also verify UUID
#    version/variant bits, Damm digits, namespace state, allocation threshold, uniqueness,
#    source authority and referential integrity."
#
# That sentence is the reason `damm_required` exists on each pattern below. A regex cannot
# express a check digit, so a validator that matches the shape and stops has done half the
# job and will report a transposed identifier as valid. `OH-DOC-000001-4` matches every
# pattern here and is not a legal identifier.

source:
  document: OH-DOC-000001-3
  revision: R01
  sections: ['4.1', '9.4', '9.5', '10.1', 'B.1']

grammars:
  # §4.1. NAMESPACE is an allocated alphabetic code; NNNNNN is a six-digit sequence allocated
  # independently within that namespace; C is the Damm digit over NNNNNN alone.
  #
  # The namespace alternation is enumerated rather than written [A-Z]{2,5}. A character-class
  # form would accept OH-XYZ-000001-3 for a namespace that was never allocated, which is
  # exactly what §8's "an identifier that does not appear in the registry does not exist"
  # forbids. RCD is absent here by design — see namespaces.yaml.
  enterprise:
    pattern: '^OH-(ITM|DOC|INTF|BIND|SWC|DAT|MDL|REQ|RSK|TST|CHG|ADR|BSL|RLS|QEV|EQP|SUP|LOT|WRK|WAR|CONF)-[0-9]{6}-[0-9]$'
    damm_required: true
    damm_payload: sequence # the six digits only, not the namespace
    examples:
      - OH-ITM-000123-4
      - OH-DOC-000042-7
      - OH-INTF-000001-3
      - OH-SWC-000019-6
      - OH-DOC-000001-3 # this registry
      - OH-DOC-000002-1 # Knowledge Fabric OGWCS
      - OH-WAR-000001-3 # allocated 1.0.0-draft.2
      - OH-CONF-000001-3 # allocated 1.0.0-draft.2

  # §9.4. YYYY is the record-creation year; NNNNNN is a global annual sequence; the Damm digit
  # covers YYYYNNNNNN — ten digits, not six.
  record:
    pattern: '^OH-RCD-[0-9]{4}-[0-9]{6}-[0-9]$'
    damm_required: true
    damm_payload: year_and_sequence
    examples: [OH-RCD-2026-000001-5]

  # §10.1. Nine digits, globally allocated across every product and site.
  serial:
    pattern: '^OH-SN-[0-9]{9}-[0-9]$'
    damm_required: true
    damm_payload: sequence
    examples: [OH-SN-000000001-3]

  # §4.4. Two digits minimum, no lowercase suffix. The "no minor-revision suffix" callout is
  # explicit that R04a is prohibited: a changed definition is a new revision or it is covered
  # by an already approved configuration rule. There is no third option.
  revision:
    pattern: '^R[0-9]{2,}$'
    damm_required: false
    examples: [R01, R02, R10]

  # §7.2 / §8.2 — SemVer 2.0.0, used for interface contracts and software components.
  semver:
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
    damm_required: false
    examples: ['1.4.0', '0.1.0-draft.2', '2.0.0+build.7']

  # RFC 9562 UUIDv7. Version nibble pinned to 7 and variant to [89ab] so a v4 cannot be
  # accepted where a v7 is required. Identical to ontology/meta.yaml's `uuid_pattern` — the
  # registry pack asserts they agree rather than trusting that they do.
  uuid:
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    damm_required: false
    examples:
      - 01a01b95-5555-7f3f-bfc1-bf029a2e358a # this registry's object_id, §15.2
      - 01a01b95-5555-76b6-8869-3f0ac20e7994 # §4.1 illustrative

# §9.5. The first underscore terminates the identity portion; everything after it is human
# text that may repeat controlled information but is never its sole carrier.
filename:
  pattern: '^(?<identity>OH-[A-Z]{3,4}-[0-9-]+)-(?<version>R[0-9]{2,}|v[0-9][0-9A-Za-z.+-]*)_(?<title>[A-Za-z0-9_.-]+)\.(?<ext>[A-Za-z0-9.]+)$'
  # A record filename carries no revision — a record is not revised (§9.4), so the version
  # segment is absent and the identity portion runs to the underscore.
  record_pattern: '^(?<identity>OH-RCD-[0-9]{4}-[0-9]{6}-[0-9])_(?<title>[A-Za-z0-9_.-]+)\.(?<ext>[A-Za-z0-9.]+)$'
  examples:
    - OH-ITM-000123-4-R02_Soma_AFE_Assembly.step
    - OH-DOC-000001-3-R01_Identifier_and_Configuration_Registry.docx
    - OH-SWC-000019-6-v1.4.0_LamQuant_Firmware.tar.zst
    - OH-RCD-2026-000001-5_Incoming_Inspection.pdf
