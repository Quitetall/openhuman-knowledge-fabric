# Workstation dependency stack for development and local dogfood rehearsal.
#
# This is NOT a private-host or production topology. Credentials here are fixed and public on
# purpose so a clean checkout runs without setup. Ports bind to loopback so those credentials
# are not exposed to the LAN. KF_DEPLOYMENT_PROFILE records which application posture is being
# rehearsed; dogfood still needs the API's real OIDC variables and a bearer-capable client.

name: openhuman-knowledge-fabric

x-kf-profile-labels: &kf-profile-labels
  org.openhuman.knowledge-fabric.deployment-profile: ${KF_DEPLOYMENT_PROFILE:?Set KF_DEPLOYMENT_PROFILE to development or dogfood}

services:
  postgres:
    # PostgreSQL 18 is a hard requirement, not a preference: uuidv7() is used for object
    # identity and was added in this major version.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: kf-postgres
    restart: unless-stopped
    labels: *kf-profile-labels
    environment:
      POSTGRES_DB: kf
      POSTGRES_USER: kf_owner
      POSTGRES_PASSWORD: dev-only-not-a-secret
      # Deterministic collation. A libc collation change silently reorders text indexes and
      # corrupts uniqueness assumptions across an OS upgrade.
      POSTGRES_INITDB_ARGS: '--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8'
    command:
      - postgres
      - -c
      - wal_level=logical # required for PITR and logical replication (Gate 8)
      - -c
      - log_statement=ddl
      - -c
      - track_commit_timestamp=on
      # JIT off, because the planner's cost estimates cannot be trusted on this schema and JIT
      # is triggered by exactly those estimates.
      #
      # Row-level security wraps almost every table (113 of 139 force it) and its subplans
      # inflate the estimate far out of proportion to the work. Measured by
      # tests/database/rls-read-cost.test.ts at 12k documents per organization: a count over
      # controlled_document estimates cost 2_222_440 — 22x the default jit_above_cost of
      # 100_000 — and then executes in 16ms while spending 122ms compiling. Same query, same
      # data, jit off: 16.5ms. JIT was 10x slower than no JIT.
      #
      # It is not paying for itself anywhere else either. Of the four shapes that file measures
      # against a populated database, JIT engages on ONE and loses badly; on the other three
      # (point read, bounded list of 50, bounded envelope join) it never triggers at all, so
      # there is no measured case of it helping.
      #
      # Off rather than a raised jit_above_cost: a threshold is a number that silently expires
      # as the data grows, and the underlying problem is that the estimate is ~100x the real
      # work. Revisit if a genuinely analytical workload appears — and revisit with that file,
      # which will answer it again.
      - -c
      - jit=off
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Mount the PARENT, not .../data. From 18 the image stores the cluster in a
      # major-version subdirectory so `pg_upgrade --link` does not have to cross a mount
      # boundary. Records here are retained indefinitely, so this system will be carried
      # across many major versions — the upgrade path is not a detail to get wrong later.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kf_owner -d kf']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    # Pinned, like postgres and keycloak. A floating tag means a clean checkout can stop
    # working because an upstream release changed, with nothing in this repo to explain it.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: kf-minio
    restart: unless-stopped
    labels: *kf-profile-labels
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kf-dev-access-key
      MINIO_ROOT_PASSWORD: dev-only-not-a-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the buckets the evidence vault needs and turns on object versioning.
  # Versioning must exist before the first object is written — enabling it later does not
  # retroactively protect anything already stored.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: kf-minio-init
    labels: *kf-profile-labels
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kf http://minio:9000 kf-dev-access-key dev-only-not-a-secret &&
      mc mb --ignore-existing kf/kf-artifacts &&
      mc mb --ignore-existing kf/kf-snapshots &&
      mc mb --ignore-existing kf/kf-checkpoints &&
      mc mb --ignore-existing kf/kf-exports &&
      mc version enable kf/kf-artifacts &&
      mc version enable kf/kf-snapshots &&
      mc version enable kf/kf-checkpoints &&
      mc version enable kf/kf-exports &&
      echo 'buckets ready with versioning enabled'
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    container_name: kf-keycloak
    restart: unless-stopped
    labels: *kf-profile-labels
    command: ['start-dev', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set the local Keycloak bootstrap username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set the local Keycloak bootstrap password}
      # Exposes /health/* on the management interface — see the healthcheck below.
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
    # Port 9000 is deliberate and is NOT MinIO's. Since Keycloak 25 the health and metrics
    # endpoints live on a separate MANAGEMENT interface listening on 9000; localhost:8080
    # /health/ready returns 404. This runs inside the Keycloak container, so localhost:9000
    # is Keycloak's own management port — MinIO would be reachable at minio:9000, and is
    # not consulted here.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  minio-data:
  keycloak-data:
