# Workstation dependency stack for development and local dogfood rehearsal.
#
# This is NOT a private-host or production topology. Credentials here are fixed and public on
# purpose so a clean checkout runs without setup. Ports bind to loopback so those credentials
# are not exposed to the LAN. KF_DEPLOYMENT_PROFILE records which application posture is being
# rehearsed; dogfood still needs the API's real OIDC variables and a bearer-capable client.

name: openhuman-knowledge-fabric

x-kf-profile-labels: &kf-profile-labels
  org.openhuman.knowledge-fabric.deployment-profile: ${KF_DEPLOYMENT_PROFILE:?Set KF_DEPLOYMENT_PROFILE to development or dogfood}

services:
  postgres:
    # PostgreSQL 18 is a hard requirement, not a preference: uuidv7() is used for object
    # identity and was added in this major version.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: kf-postgres
    restart: unless-stopped
    labels: *kf-profile-labels
    environment:
      POSTGRES_DB: kf
      POSTGRES_USER: kf_owner
      POSTGRES_PASSWORD: dev-only-not-a-secret
      # Deterministic collation. A libc collation change silently reorders text indexes and
      # corrupts uniqueness assumptions across an OS upgrade.
      POSTGRES_INITDB_ARGS: '--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8'
    command:
      - postgres
      - -c
      - wal_level=logical # required for PITR and logical replication (Gate 8)
      - -c
      - log_statement=ddl
      - -c
      - track_commit_timestamp=on
      # JIT off, because the planner's cost estimates cannot be trusted on this schema and JIT
      # is triggered by exactly those estimates.
      #
      # Row-level security wraps almost every table (113 of 139 force it) and its subplans
      # inflate the estimate far out of proportion to the work. Measured by
      # tests/database/rls-read-cost.test.ts at 12k documents per organization: a count over
      # controlled_document estimates cost 2_222_440 — 22x the default jit_above_cost of
      # 100_000 — and then executes in 16ms while spending 122ms compiling. Same query, same
      # data, jit off: 16.5ms. JIT was 10x slower than no JIT.
      #
      # It is not paying for itself anywhere else either. Of the four shapes that file measures
      # against a populated database, JIT engages on ONE and loses badly; on the other three
      # (point read, bounded list of 50, bounded envelope join) it never triggers at all, so
      # there is no measured case of it helping.
      #
      # Off rather than a raised jit_above_cost: a threshold is a number that silently expires
      # as the data grows, and the underlying problem is that the estimate is ~100x the real
      # work. Revisit if a genuinely analytical workload appears — and revisit with that file,
      # which will answer it again.
      - -c
      - jit=off
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Mount the PARENT, not .../data. From 18 the image stores the cluster in a
      # major-version subdirectory so `pg_upgrade --link` does not have to cross a mount
      # boundary. Records here are retained indefinitely, so this system will be carried
      # across many major versions — the upgrade path is not a detail to get wrong later.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kf_owner -d kf']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  seaweedfs:
    # The working object store (ADR 0039): SeaweedFS's S3 gateway, master, volume server and filer
    # in one process, which is the simplest durable shape on one machine — every byte and every
    # filer record is under /data. Pinned by release AND digest, like postgres and keycloak: a
    # floating tag means a clean checkout can stop working because an upstream release changed,
    # with nothing in this repo to explain it. (MinIO, which this replaced, is the example: its
    # pinned images were deleted from every registry in 2026-09.)
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: kf-seaweedfs
    restart: unless-stopped
    labels: *kf-profile-labels
    # -ip=127.0.0.1: the servers find one another on loopback, so a recreated container (new
    # address) still reads its own volume. Only the S3 gateway binds beyond loopback, and only
    # so the published port reaches it; the filer, which has no authentication, does not.
    # -s3.iam=false: identities come from the file and nothing else, never from a runtime API.
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3
      - -s3.ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/identities.json
      - -s3.iam=false
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - seaweedfs-data:/data
      # The development identity, with the public credentials below. Read-only.
      - ./deploy/object-store/development-identities.json:/etc/seaweedfs/identities.json:ro
      - ./deploy/object-store/ready.sh:/kf/ready.sh:ro
    # Healthy means able to serve what it holds, not merely listening: after a restart the S3
    # gateway answers for ~5 s before the master knows the volumes, and reads in that window fail
    # with InternalError. ready.sh waits for the master to know every volume file on disk.
    healthcheck:
      test: ['CMD', 'sh', '/kf/ready.sh', '/data']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Creates the buckets the evidence vault needs and turns on object versioning, through the S3
  # API, then reads every bucket back and fails unless versioning is Enabled.
  # Versioning must exist before the first object is written — enabling it later does not
  # retroactively protect anything already stored.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: kf-seaweedfs-init
    labels: *kf-profile-labels
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/kf/init-buckets.sh']
    environment:
      KF_OBJECTS_ENDPOINT: http://seaweedfs:8333
      KF_OBJECTS_ACCESS_KEY_ID: kf-dev-access-key
      KF_OBJECTS_SECRET_ACCESS_KEY: dev-only-not-a-secret
    volumes:
      - ./deploy/object-store/init-buckets.sh:/kf/init-buckets.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    container_name: kf-keycloak
    restart: unless-stopped
    labels: *kf-profile-labels
    # `--import-realm` reads /opt/keycloak/data/import on startup. Without it the stack came up
    # healthy with NO realm at all: `/realms/knowledge-fabric/.well-known/openid-configuration`
    # returned 404 while every OIDC setting in .env pointed at it, so the login could never be
    # attempted and the failure looked like an application problem. Keycloak skips a realm that
    # already exists, so this is safe on every subsequent start.
    command: ['start-dev', '--http-port=8080', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set the local Keycloak bootstrap username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set the local Keycloak bootstrap password}
      # Exposes /health/* on the management interface — see the healthcheck below.
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      # Read-only: the realm definition is a committed artifact, and a container that could
      # rewrite it would let local drift silently become the checked-in truth. Re-export
      # deliberately (see docs/deployment/identity-and-login.md) rather than by accident.
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    # Port 9000 is deliberate and is NOT the object store's. Since Keycloak 25 the health and
    # metrics endpoints live on a separate MANAGEMENT interface listening on 9000; localhost:8080
    # /health/ready returns 404. This runs inside the Keycloak container, so localhost:9000 is
    # Keycloak's own management port — the object store is seaweedfs:8333 (published on the
    # host's 127.0.0.1:9000), and is not consulted here.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  seaweedfs-data:
  keycloak-data:
