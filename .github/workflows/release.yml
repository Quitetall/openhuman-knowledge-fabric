name: Release

on:
  push:
    tags: ['v*']

# WHAT THIS WORKFLOW DELIBERATELY DOES NOT DO: build the deployable release tree.
#
# `docs/deployment/private-host.md` is explicit that the workstation build is promoted
# byte-for-byte and that the host "does not run `pnpm build`, resolve a newer dependency or
# substitute source from another checkout". The build happens once, in a disposable worktree,
# at the exact commit, and its `SHA256SUMS` is what the host verifies against.
#
# A CI job that also built a release tree would produce a SECOND artifact by a second path.
# Two artifacts for one tag is the drift this repository keeps removing, and here it would be
# the worst version of it: the one an operator installs and the one a release page advertises
# would not be the same bytes, and nothing would say which was which.
#
# So this proves the tag is green and publishes provenance. The artifact stays a workstation
# act, performed by a person following the documented recipe.

permissions:
  contents: read

jobs:
  gate:
    name: the tag passes every gate
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.1'
          cache: pnpm

      # THE SAME six host requirements ci.yml provisions. Until 2026-08-20 this workflow
      # installed bubblewrap and nothing else, so the gate that qualifies a v1.0.0 tag would
      # have run without pandoc, python3, the PostgreSQL 18 client, /usr/bin/node or the
      # user-namespace sysctl. It had never run, so nothing exposed it.
      - uses: ./.github/actions/provision-host

      - run: pnpm install --frozen-lockfile

      # The same command a contributor runs and the same one CI runs on every push. A release
      # that gated itself differently from every other commit would not be evidence about the
      # thing being released.
      - name: Gate
        run: pnpm gate

  provenance:
    name: bill of materials
    needs: gate
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write # to attach the SBOM to the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A records system whose entire claim is provenance should be able to say what it is made
      # of.
      #
      # NOT `--lockfile-only`, which was the first version of this step and was measured to be
      # wrong: it produces 0 of 511 components with licence data, against 426 without it,
      # because pnpm reads licences from the store and the lockfile does not record them. The
      # install above is `--frozen-lockfile`, so the store holds exactly the lockfile's
      # resolution — reading it adds licence data without describing a different tree. A bill of
      # materials with no licences in it is most of the way to not being one.
      #
      # 87 of the 511 components still carry no licence, measured on the v0.9.0 bill. That is the
      # package's own metadata missing, not a generation flag, and an absent licence must not be
      # read as a permissive one. The count moves with the dependency tree — it was 85 when this
      # was written — so treat it as an order of magnitude, not a checksum.
      #
      # The spec version is pinned. pnpm's default is 1.7 and moves with pnpm; a release
      # artifact whose format changes because a tool updated is a change nobody decided.
      #
      # This is NOT invoked through a package.json script. `sbom` is a pnpm built-in, and a
      # script by that name is silently shadowed — `pnpm sbom` runs pnpm's command and never
      # the script, with no warning. That was written here once and the mistake is worth the
      # sentence.
      #
      # WHAT THE BILL DOES NOT COVER: non-npm dependencies. PostgreSQL, MinIO, Keycloak,
      # bubblewrap and the Node runtime are all part of what gets deployed and none of them
      # appear in it; `docs/deployment/private-host.md` is the inventory for those.
      - name: Generate CycloneDX SBOM
        run: pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.6 --out sbom.cdx.json

      # A tag push does NOT create a GitHub Release. `gh release upload` against a tag that has
      # no release fails with "release not found", so the first real tag would have generated a
      # bill of materials and then thrown it away — a failure that could only show up on release
      # day. Create if absent, then upload, so the step is correct whether the release was made
      # by hand first or not.
      #
      # `--verify-tag` refuses to create a release for a tag that does not exist, so a mistyped
      # or deleted ref fails here instead of silently publishing an empty release.
      #
      # `--generate-notes` is deliberate, not a shortcut to stop the step failing: the release
      # notes for this repository are the commit log, because the commit messages here record
      # what was measured and what was ruled out. It only applies when CI creates the release —
      # a release written by hand beforehand keeps its own body and just receives the SBOM.
      #
      # The view-then-create is not atomic. If something else creates the release in the gap,
      # `create` fails and takes the step with it. That is the direction to fail in: the
      # alternative, `|| true`, would swallow an auth or network failure just as quietly.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json --clobber
