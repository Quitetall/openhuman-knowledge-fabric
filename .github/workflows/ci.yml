name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, raised per job only where a job needs more. A workflow that can write
# to the repository is a workflow whose dependencies can.
permissions:
  contents: read

env:
  NODE_VERSION: '24.18.1'

# Jobs are added as their subject matter lands. A job that passes because there is nothing
# for it to check is worse than no job: it reports a guarantee that does not exist.
#
#   Gate 4 adds: export round-trip and audit checkpoint verification
#   Gate 5 adds: Playwright end-to-end
#   Gate 8 adds: dependency scanning and the restore drill
#
# The database suite needs no service container: Testcontainers starts its own PostgreSQL 18
# from inside the test run. That keeps the container image pinned in one place — the harness
# — instead of drifting between here and docker-compose.yml.

jobs:
  verify:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    env:
      # ONE client toolchain, named rather than inherited from PATH. The backup and restore
      # drills call `kf_configure_postgres_client` (scripts/lib/secret.sh), which refuses any
      # directory whose psql/pg_dump/pg_dumpall/pg_restore do not all report PostgreSQL 18 —
      # because dump archives are versioned formats and an ambient old pg_dump fails late.
      #
      # `ubuntu-latest` ships psql 16 from PGDG, so nine drill tests failed with "PostgreSQL 18
      # client required; /usr/bin/psql reported: psql (PostgreSQL) 16.14". That was the guard
      # working correctly on a runner nobody had qualified — CI is a host like any other, and
      # `docs/deployment/private-host.md` says a host must be qualified before it is trusted.
      # This is that qualification, written down.
      KF_POSTGRES_CLIENT_DIR: /usr/lib/postgresql/18/bin
      # A 500 in a test tells you a request id and nothing else, because the API deliberately
      # refuses to leak internals to a caller and the harness builds it with logLevel 'silent'.
      # That is right in production and useless in CI, where nobody can attach a debugger: three
      # document-import tests failed here with `{"error":"internal_error","requestId":...}` and
      # the cause was not in the log at all.
      #
      # `LOG_LEVEL` is the variable the API's own config reads (apps/api/src/config.ts), not a
      # new one invented for tests, and `error` keeps the output to failures rather than turning
      # the suite into a firehose.
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Provision compiler sandbox integration dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --version

      # PANDOC IS A RUNTIME DEPENDENCY OF DOCUMENT IMPORT, and was documented nowhere until this
      # run found it. `packages/documents/src/internal/pandoc-parser.ts` does `spawn('pandoc',
      # ['--from=...', '--to=json'])`, so without it every import returns 500 — which is exactly
      # what three tests did, opaquely, until LOG_LEVEL was raised and the log said
      # `spawn pandoc ENOENT`.
      #
      # The version is PRINTED, not pinned, and that is a real open question rather than an
      # oversight: the parser reads `pandoc-api-version` out of the AST and records it as the
      # atoms' parserVersion, so two hosts running different pandocs can produce different atoms
      # for the same document and the record will say so. Printing it here means a run's evidence
      # includes which parser produced it. See docs/deployment/private-host.md.
      - name: Provision the document parser
        run: |
          set -euo pipefail
          sudo apt-get install --yes pandoc
          pandoc --version | head -1

      # The compiler sandbox creates a user namespace and then disables further ones
      # (`--unshare-all --unshare-user --disable-userns`, packages/documents/src/liminal-adapter
      # /sandbox.ts). Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor by
      # default, and eleven sandbox tests failed with "preflight verified-byte transfer failed:
      # read ECONNRESET" — the child dying before it could hand back its bytes.
      #
      # Relaxing the sysctl weakens the RUNNER, which is an ephemeral VM, not the product: the
      # sandbox still passes `--disable-userns`, so nothing nested inside it gains the ability.
      # Proven rather than assumed — the probe below creates the namespace the compiler needs
      # and fails the job here, with one message, rather than eleven tests later.
      - name: Qualify the runner for the compiler sandbox
        run: |
          set -euo pipefail
          restricted="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "kernel.apparmor_restrict_unprivileged_userns = ${restricted}"
          if [ "${restricted}" != "absent" ] && [ "${restricted}" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if bwrap --unshare-user --disable-userns --ro-bind / / -- /bin/true; then
            echo "user namespace creation: works"
          else
            echo "::error::bubblewrap cannot create a user namespace on this runner, so the"
            echo "::error::document compiler sandbox cannot start. See sandbox.ts for the flags."
            exit 1
          fi

      # THE PGDG REPOSITORY HAS TO BE ADDED, which was not obvious and was got wrong once. The
      # runner's stock psql reports "16.14-1.pgdg24.04+1", and that version string was read as
      # evidence that the PGDG apt source was configured. It is not: GitHub's image ships a
      # package PGDG BUILT, without leaving the repository enabled, so `apt-get install
      # postgresql-client-18` failed with "Unable to locate package". A package's provenance is
      # not a source list.
      #
      # The signing key is checksum-pinned, for the same reason the gitleaks tarball is: this
      # workflow otherwise trusts whatever a URL serves it today. The codename comes from
      # lsb_release rather than being hardcoded, so a runner-image bump to a release PGDG does
      # not yet publish fails loudly at `apt-get update` instead of silently resolving to
      # something else.
      - name: Provision the PostgreSQL 18 client
        env:
          PGDG_KEY_SHA256: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d "$(dirname "${key}")"
          curl --fail --silent --show-error --location \
            --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "${PGDG_KEY_SHA256}  /tmp/pgdg.asc" | sha256sum --check --strict
          sudo cp /tmp/pgdg.asc "${key}"
          echo "deb [signed-by=${key}] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          # Assert the whole toolchain here, in the words the resolver uses, so a partial
          # install fails at provisioning instead of inside a drill.
          for tool in psql pg_dump pg_dumpall pg_restore; do
            path="${KF_POSTGRES_CLIENT_DIR}/${tool}"
            test -x "${path}" || { echo "::error::missing ${path}"; exit 1; }
            version="$("${path}" --version)"
            echo "${version}"
            case "${version}" in
              *'(PostgreSQL) 18'*) ;;
              *) echo "::error::${path} is not PostgreSQL 18: ${version}"; exit 1 ;;
            esac
          done

      # THE FOURTH THING THE HOST CONTRACT ASKS FOR, and the last one this runner was missing.
      # `docs/deployment/private-host.md`: "Install a Node.js version allowed by package.json
      # (>=24.18.1 <25) as the real executable /usr/bin/node. Service units and Liminal runtime
      # assembly/verification invoke that absolute path; an nvm, asdf, shell alias or PATH-only
      # Node installation does not satisfy the host contract."
      #
      # actions/setup-node installs into the runner's tool cache, so /usr/bin/node did not exist
      # and seven Liminal release tests failed with
      #   could not seal runtime closure: /usr/bin/env: '/usr/bin/node': No such file or directory
      #
      # COPIED, not symlinked, because the contract says "the real executable" and the runtime
      # closure is sealed from whatever that path resolves to. The version is asserted against
      # NODE_VERSION so this cannot quietly install a Node the lockfile does not allow.
      - name: Install Node at the absolute path the host contract requires
        run: |
          set -euo pipefail
          sudo install -m 0755 "$(command -v node)" /usr/bin/node
          installed="$(/usr/bin/node --version)"
          echo "/usr/bin/node -> ${installed}"
          test "${installed}" = "v${NODE_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dependency advisories
        run: pnpm audit --audit-level=high

  ontology:
    name: ontology consistent · generated/ current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Validates the ontology AND reports drift. It never writes: a check that repairs
      # what it inspects cannot report a failure.
      - name: Ontology check
        run: pnpm ontology:check

      # Belt and braces. `ontology:check` compares in memory; this proves a real write
      # produces byte-identical files, catching any non-determinism in the emitters.
      - name: Regenerate and diff
        run: |
          pnpm ontology:build
          if ! git diff --exit-code -- generated/; then
            echo "::error::generated/ is out of date — run 'pnpm ontology:build' and commit the result"
            exit 1
          fi

  build:
    name: build from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  secrets:
    name: no secret has ever been committed
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: the question is whether a credential was EVER
      # committed, and `fetch-depth: 1` cannot answer it. A reverted commit is still a
      # disclosure.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # THE CLI, NOT `gitleaks/gitleaks-action`. Three reasons, in order of how much they cost:
      #
      #   1. The action has been under a COMMERCIAL licence since v2.0.0 and requires a
      #      `GITLEAKS_LICENSE` secret for repositories owned by an organization. This repository
      #      is to be published under an organization, so that is a gate sitting on the publish
      #      path — and one that would first be discovered on the day of the publish.
      #   2. It transmits the repository name and owner to a third-party licence service. A
      #      secret-scanning gate should not itself be a data flow off the runner.
      #   3. It could not honestly be pinned. `@v2` resolves to an ANNOTATED TAG OBJECT, and the
      #      SHA written here for it was that tag object rather than a commit — a moving target
      #      wearing a hex string, which is the exact hazard pinning exists to remove.
      #      (`pnpm/action-setup@v4` had the same defect and was corrected in the same commit.)
      #
      # The gitleaks CLI itself is MIT. Pinned by version AND sha256, verified against the
      # project's published `gitleaks_8.30.1_checksums.txt`, so a replaced release asset fails the
      # job rather than scanning with an unknown binary.
      #
      # THAT VERIFICATION WAS DONE ONCE, BY HAND, AND CANNOT BE DONE HERE. Re-downloading the
      # checksums file from the same release and comparing against it would be circular: an
      # attacker able to replace the tarball can replace the checksums beside it. The pin is the
      # trust anchor, so bumping GITLEAKS_VERSION means re-establishing it out of band —
      # https://github.com/gitleaks/gitleaks/releases/download/v<version>/gitleaks_<version>_checksums.txt
      # read from a machine that is not the one being attacked, not copied out of the diff being
      # reviewed. Bumping the version WITHOUT updating the hash is the safe failure and already
      # fails this step loudly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # `git`, so the subject is every commit rather than the current tree. `--redact` so a real
      # finding is reported without being printed into the build log.
      #
      # Allowlists live in `.gitleaks.toml`, which records the three findings this repository's
      # history produces and why none of them is a credential. Read that file before adding a
      # fourth — particularly its warning about `paths`.
      - name: Scan full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .
