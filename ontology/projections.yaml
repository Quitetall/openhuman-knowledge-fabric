# Corpus projections — declarative readings of a master record.
#
# A Master is the exact authorized corpus (ADR 0013). Everything a person sees ON it — "your
# record" versus the organization view, a project page, an agent's context bundle — is a
# PROJECTION: a declared, versioned reading that can only partition and order what the corpus
# already contains. `projection_members ⊆ master_members` is enforced by construction, and every
# member lands in exactly one section, with `remainder` catching whatever no section claimed —
# so a new object type can never disappear merely because no definition knows it yet.
#
# The grammar is a closed algebra over things the ontology already declares:
#   anchor       what the traversal starts from: the person the corpus was compiled for
#   traverse     which relation types to walk (person_anchors = every relation declaring
#                person_anchor: true, following each type's propagation_class) and how deep
#   sections     ordered; the FIRST whose `select` admits a member takes it
#                  reached    in the traversal closure          unreached  not in it
#                  withdrawn  carried forward after withdrawal   all        every member
#                an optional `filter` narrows a section further (object_types, lifecycle_states,
#                classification_max, item_states)
#   remainder    the mandatory last section; named so its presence in output is a check
#   sort         declared envelope fields only
#   parameters   typed from meta.yaml kinds; bound at read time, part of the projection digest
#   budgets      hard ceilings the engine refuses to exceed rather than silently truncate:
#                max_members (members admitted) and max_runtime_ms (a deadline on evaluation).
#                Both are required, and max_depth, max_members and max_runtime_ms are each
#                capped by the grammar's ceiling (PROJECTION_GRAMMAR_LIMITS in the compiler)
#
# The grammar is CLOSED (KF-SAS-RQ-116): a key not named above is refused by the compiler, not
# ignored, because an ignored `max_detph` would read as a bound and be none.
#
# No expressions, no SQL. Anything this cannot say is a reason to add a primitive here, where
# it is reviewed, rather than a reason to write a query somewhere it is not.

projection_definitions:
  # The reading the master record has always had. Sections used to be stored inside the claim;
  # they are derived by this definition now, against the relation graph as it is when asked.
  - id: master_sections
    title: Master record sections
    version: 1
    anchor: person
    parameters: []
    traverse: { relations: person_anchors, max_depth: 8 }
    sections:
      - { id: withdrawn, title: Withdrawn, select: withdrawn }
      - { id: your_record, title: Your record, select: reached }
      - { id: org_view, title: Organization view, select: unreached }
    remainder: { id: raw_corpus, title: Raw corpus }
    sort: [object_type, title, object_id]
    budgets: { max_members: 100000, max_runtime_ms: 5000 }

  # Everything, unsectioned. The identity projection: a reading that adds no reading.
  - id: raw_corpus
    title: Raw corpus
    version: 1
    anchor: person
    parameters: []
    sections: []
    remainder: { id: raw_corpus, title: Raw corpus }
    sort: [object_type, title, object_id]
    budgets: { max_members: 100000, max_runtime_ms: 5000 }

  # What a model is handed. Not a render format: a definition family with its own digest, so
  # "what did the agent actually see" is a projection result, exact source ids and digests
  # included, that the model can summarize but cannot enlarge.
  #
  # token_budget is bound and carried into the projection digest today; it does not yet cut
  # content — member and runtime budgets are the only ceilings the engine applies (ADR 0014,
  # "budgets beyond member count"). Two bundles with different budgets are therefore
  # distinguishable by digest while identical in membership, until the budget governs rendering.
  - id: agent_context
    title: Agent context bundle
    version: 1
    anchor: person
    parameters:
      - { name: token_budget, type: integer, required: true, minimum: 256, maximum: 1000000 }
    traverse: { relations: person_anchors, max_depth: 8 }
    sections:
      - { id: relevant, title: Relevant to this person, select: reached }
      - {
          id: organization,
          title: Organization context,
          select: unreached,
          filter: { item_states: [included] },
        }
    remainder: { id: raw_corpus, title: Everything else }
    sort: [object_type, title, object_id]
    budgets: { max_members: 20000, max_runtime_ms: 5000 }

  # The Object View. One definition serves every object type: anchor at the member the reader
  # names, walk every relation both directions one hop (backlinks come free), keep only the
  # anchor and what touches it. History and available actions are facets the API attaches from
  # the audit chain and the state machines; they are not corpus members, so they are not here.
  - id: object_view
    title: Object view
    version: 1
    anchor: object
    parameters:
      - { name: object_id, type: uuid, required: true }
    traverse: { relations: all, max_depth: 1 }
    filter: { reachability: reached }
    sections:
      - { id: subject, title: This record, select: anchor }
      - { id: relationships, title: Relationships, select: reached }
    remainder: { id: other, title: Other }
    sort: [object_type, title, object_id]
    budgets: { max_members: 5000, max_runtime_ms: 1000 }

  # The living organization overview (ADR 0040 decision 3; KF-SAS-RQ-267, RQ-268). Generated, not
  # written: it reads the records that say what the organization is and is doing, as each reader
  # may read them. A statement is a member, so it links to its source by construction and cannot
  # be about a record outside the reader's corpus. The declared filter is the narrowing: documents,
  # messages and other artifacts are not statements about the organization, and are counted as
  # excluded rather than placed. Evaluated over only the members of these types (the engine's
  # type-scoped reading), so its cost follows the organization's records, not its documents.
  - id: organization_overview
    title: Organization overview
    version: 1
    anchor: person
    parameters: []
    filter:
      {
        object_types:
          [
            organization,
            organization_overview,
            initiative_project,
            engagement,
            work_package,
            work_order,
            milestone,
            deliverable,
            decision_record,
            change_record,
            risk,
            nonconformity,
            capa,
            complaint,
            product_system,
            requirement,
            release,
            baseline,
            supplier,
            configuration_item,
            controlled_document,
            person,
            role_assignment,
          ],
      }
    sections:
      - {
          id: organization,
          title: The organization,
          select: all,
          filter: { object_types: [organization, organization_overview] },
        }
      - {
          id: projects,
          title: Projects and engagements,
          select: all,
          filter: { object_types: [initiative_project, engagement] },
        }
      - {
          id: work,
          title: Work under way,
          select: all,
          filter: { object_types: [work_package, work_order, milestone, deliverable] },
        }
      - {
          id: decisions,
          title: Decisions and changes,
          select: all,
          filter: { object_types: [decision_record, change_record] },
        }
      - {
          id: risks,
          title: Risks and quality,
          select: all,
          filter: { object_types: [risk, nonconformity, capa, complaint] },
        }
      - {
          id: products,
          title: Products,
          select: all,
          filter:
            {
              object_types:
                [product_system, requirement, release, baseline, supplier, configuration_item],
            },
        }
      - {
          id: documents,
          title: Controlled documents,
          select: all,
          filter: { object_types: [controlled_document] },
        }
      - {
          id: people,
          title: Who does what,
          select: all,
          filter: { object_types: [person, role_assignment] },
        }
    remainder: { id: other, title: Other records }
    sort: [object_type, title, object_id]
    budgets: { max_members: 20000, max_runtime_ms: 2000 }
