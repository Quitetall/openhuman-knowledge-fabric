# Relation types — the typed edges between objects.
#
# Direction is canonical even where a view renders the inverse label. `acyclic: true`
# is machine-checked: a cycle in decomposition or supersession is a corrupt graph, not
# an unusual one.

relation_types:
  - {
      id: contains,
      inverse: contained_by,
      acyclic: true,
      person_anchor: false,
      propagation_class: composition_down,
      anchor_depth: 8,
      source_types:
        [
          organization,
          product_system,
          configuration_item,
          baseline,
          release,
          initiative_project,
          work_package,
          work_order,
          document_composition,
          controlled_document,
          artifact,
        ],
      target_types:
        &any_type [
          organization,
          person,
          role_assignment,
          engagement,
          product_system,
          initiative_project,
          work_package,
          work_order,
          work_execution,
          decision_record,
          change_record,
          deliverable,
          artifact,
          acceptance_record,
          invoice,
          payment,
          requirement,
          risk,
          test,
          release,
          baseline,
          configuration_item,
          interface_contract,
          physical_binding,
          controlled_document,
          authored_fragment,
          document_composition,
          ml_promotion_decision,
          nonconformity,
          capa,
          supplier,
          equipment,
          complaint,
          risk_control,
          test_definition,
          test_execution,
          milestone,
          work_order_amendment,
          warrant,
          observation,
        ],
    }
  - {
      id: decomposes_into,
      inverse: part_of,
      acyclic: true,
      person_anchor: false,
      propagation_class: composition_down,
      anchor_depth: 8,
      source_types:
        [
          initiative_project,
          work_package,
          product_system,
          configuration_item,
          requirement,
          risk,
          test,
        ],
      target_types:
        [
          initiative_project,
          work_package,
          product_system,
          configuration_item,
          requirement,
          risk,
          test,
          milestone,
          deliverable,
        ],
    }
  - {
      id: affects,
      inverse: affected_by,
      person_anchor: false,
      propagation_class: lateral_none,
      anchor_depth: 0,
      source_types: *any_type,
      target_types: *any_type,
    }
  - {
      id: authorizes,
      inverse: authorized_by,
      person_anchor: true,
      propagation_class: authority_one_hop_up,
      anchor_depth: 1,
      source_types:
        [
          person,
          role_assignment,
          organization,
          work_order,
          decision_record,
          change_record,
          acceptance_record,
          engagement,
          initiative_project,
          warrant,
          work_order_amendment,
        ],
      target_types: *any_type,
    }
  - {
      id: executes,
      inverse: executed_by,
      person_anchor: true,
      propagation_class: composition_down,
      anchor_depth: 8,
      source_types:
        [person, organization, role_assignment, work_execution, test_execution, warrant],
      target_types:
        [
          work_order,
          work_package,
          initiative_project,
          test_definition,
          test,
          change_record,
          warrant,
          capa,
        ],
    }
  - {
