  - {
      id: assigned_to,
      inverse: assignee_of,
      person_anchor: true,
      propagation_class: authority_one_hop_up,
      anchor_depth: 1,
      source_types: *any_type,
      target_types: &agent_type [person, organization, role_assignment, engagement, supplier],
    }
  - {
      id: scoped_to,
      inverse: scope_of,
      person_anchor: true,
