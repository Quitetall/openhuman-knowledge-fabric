  # ── Gate 6 ──────────────────────────────────────────────────────────────────────────────
  - {
      id: conforms_to,
      inverse: conformed_to_by,
      person_anchor: false,
      propagation_class: lateral_none,
      anchor_depth: 0,
      source_types: [configuration_item, physical_binding, product_system],
      target_types: [interface_contract, controlled_document, requirement],
    }
