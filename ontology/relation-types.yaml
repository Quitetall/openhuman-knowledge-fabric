      inverse: remediates,
      person_anchor: true,
      propagation_class: provenance_backward,
      anchor_depth: 8,
      source_types: [nonconformity, complaint, risk],
      target_types: [capa, change_record, risk_control, work_package],
    }
  # ADR 0034 (proposed): what an observation is about. Source is the observation, target the
  # record it concerns. Lateral: being mentioned in an observation does not make a record
  # relevant to whoever is relevant to the observation, and the reverse.
  - {
      id: concerns,
      inverse: concerned_in,
      person_anchor: false,
      propagation_class: lateral_none,
      anchor_depth: 0,
      source_types: [observation],
      target_types: *any_type,
    }
