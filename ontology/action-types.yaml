  # Grants a person an organization-scoped, effective-dated clearance (ADR 0011).
  #
  # This type exists because `org.person_clearance.granted_by_action` is a NOT NULL foreign key
  # to `core.action`: a clearance that cannot name the recorded act that granted it is refused by
  # the database. Nothing in the ontology named that act, so the only way to satisfy the
  # constraint was to cite an unrelated type — which writes a false statement into the audit log
  # of a system whose entire purpose is a truthful record.
  #
  # Dispatched normally in the ordinary case: an already-cleared person clears a colleague. The
  # effect lives in @kf/authorization and is registered as the `authority` group.
  #
  # The one case that CANNOT be dispatched is the FIRST grant in an organization, because
  # dispatch binds authoritative clearance before effects run and there is no clearance yet to
  # bind. That one is made by an owner-credential bootstrap act —
  # `apps/api/src/admin/grant-authority.ts` — which records this same action type, extends the
  # audit chain through the same helper, and writes the row through the same
  # `insertPersonClearance` the effect uses.
  - id: grant_person_clearance
    audited: true
    transactional: true
    drives: []
    requires: act

  # Access grants (ADR 0016). `grant_access` targets the object being made reachable and names
  # the principal (a person or a role assignment), the capability (read | act) and an optional
  # classification ceiling in its payload; `org.access_grant.granted_by_action` is a NOT NULL
  # foreign key to the recorded act. `revoke_access` targets the same scope object and names
  # the grant; the row is updated, never deleted — what was permitted remains evidence.
  - id: grant_access
    audited: true
    transactional: true
    drives: []
    requires: act
  - id: revoke_access
    audited: true
    transactional: true
    drives: []
    requires: act

  # Storage locations (ADR 0017). `replicate_artifact_version` targets the artifact and names
  # the version, target store and role (hot_cache | durable_copy | evidence_copy — never
  # public_copy, which is a publication act) in its payload; the copy is verified on arrival.
  # `verify_artifact_location` re-hashes the bytes at one location and records the outcome
  # either way; a failed verification is the finding.
  - id: replicate_artifact_version
    audited: true
    transactional: true
    drives: []
  - id: verify_artifact_location
    audited: true
    transactional: true
    drives: []

  # R6 allocation (ADR 0018). Targets exactly one object; the registry allocates the next free
  # identifier under the namespace the object's TYPE declares. The request carries no
  # identifier — there is no field for one — and the allocated value is returned in the
  # action receipt, read from `registry.identifier_allocation` by the act that wrote it.
  - id: allocate_enterprise_identifier
    audited: true
    transactional: true
    drives: []
    requires: act

