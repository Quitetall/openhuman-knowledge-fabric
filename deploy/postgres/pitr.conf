# Continuous archiving, for a deployment whose declared recovery objective requires it.
#
# Include from postgresql.conf, then restart — `archive_mode` cannot be changed with a reload:
#
#     include = 'conf.d/pitr.conf'
#
# This is NOT the default posture. A deployment that declares
# `ops.recovery_objective.requires_pitr = false` is saying its recovery point is the backup
# interval, which for a daily logical backup means up to a day of work. That is a legitimate
# decision when the work can be reconstructed from elsewhere — contractor submissions arrive
# by email, invoices exist in the accounting system — and an expensive one to reverse later,
# which is why it is written down rather than assumed either way.
#
# With this file in place, `pitr_readiness` stops merely reporting `archive_mode` and starts
# checking it against the decision: archiving off, or archiving whose last attempt failed,
# becomes a readiness FAILURE.

wal_level = replica
archive_mode = on

# The archive command has exactly one hard requirement: it must NOT overwrite an existing
# file, and it must fail if it cannot guarantee that. PostgreSQL reuses WAL segment names
# after a timeline change, and an archive that silently overwrites one destroys the ability to
# recover to any point before it — the failure that makes PITR look configured and not be.
#
# `test ! -f` before `cp` is the documented form. `cp -n` is NOT a substitute: it exits 0 when
# it skips, which tells PostgreSQL the segment was archived when it was not.
archive_command = 'test ! -f /srv/kf-wal/%f && cp %p /srv/kf-wal/%f'

# A segment is archived when it fills OR when this elapses, whichever is first. It is the
# real recovery point on a quiet system: without it, a database with light traffic can hold
# unarchived WAL for hours because the current segment never fills.
#
# Five minutes to match an RPO of 300s. Raise it and the objective is not met; lower it and
# the archive fills with mostly-empty 16MB segments.
archive_timeout = 5min

# Retention on /srv/kf-wal is NOT set here, because it cannot be: WAL is only useful with a
# base backup older than it. Keep every segment written since the oldest base backup you
# intend to be able to restore, and delete by that rule rather than by age.
#
#     pg_archivecleanup /srv/kf-wal <oldest-base-backup-start-wal>
#
# Deleting by age instead is how a cluster ends up with archives that cover a window no base
# backup reaches.

# Base backups belong on the same schedule and the same off-site copy as the logical ones.
# `pg_basebackup --wal-method=stream --checkpoint=fast -D /srv/kf-base/$(date -u +%Y%m%d)`
# produces one; record it in `ops.backup_run` with kind='base' so readiness counts it.
#
# The logical dump and the base backup are not redundant. The base backup plus WAL recovers
# the cluster to a moment; the logical dump plus the canonical export survives a PostgreSQL
# major version this cluster's binaries can no longer read, which — with retention unbounded
# under ISO 13485 4.2.5 and a device lifetime still undefined — is a horizon this deployment
# will actually reach.
