# Planner settings for a deployment whose tables are almost all under row-level security.
#
# Include from postgresql.conf, then reload — unlike `pitr.conf` nothing here needs a restart:
#
#     include = 'conf.d/planner.conf'
#
# UNLIKE pitr.conf, this is NOT optional and NOT posture-dependent. `docker-compose.yml` and the
# test harness both set it, so a private host that does not include this file is the only place
# in the system still running the configuration that was measured to be 8-14x slower.

# JIT off, because the planner's cost estimates cannot be trusted on this schema and JIT is
# triggered by exactly those estimates.
#
# Row-level security wraps almost every table: 143 of 169 have it ENABLED and 70 of those FORCE
# it. Its subplans inflate the estimate far out of proportion to the work.
#
# That first figure read "113 of 139 force it" until 2026-09-04, when the schema was installed
# on a host for the first time and measured. Both halves were wrong. The 73 tables that enable
# without forcing are the domain tables — work, quality, engineering, product, finance, and
# parts of core, org and content — and forcing matters only for a table's OWNER, which the
# application never is. It is not a hole for kf_app; it is a hole for anyone connecting as
# kf_migrator. A count over quality.controlled_document at
# 12k documents per organization estimates cost 2_222_440, twenty-two times the default
# jit_above_cost of 100_000, then executes in 16ms after spending 122ms compiling. The estimate
# is roughly a hundred times the real work, so the trigger is systematically wrong here.
#
# Measured by tests/database/rls-read-cost.test.ts, same data, same machine, jit on then off:
#
#     training_requirement · policy     294.9ms -> 21.3ms
#     controlled_document · policy      160.8ms -> 18.5ms
#     full scan count                   161.3ms -> 18.2ms   (JIT ENGAGED -> jit idle)
#     training_requirement · join       180.6ms -> 60.1ms
#
# The join improving too is the tell that this was never only an RLS problem.
#
# Of the four shapes that file runs against a populated database, JIT engages on ONE and loses;
# on point read, bounded list of 50, and bounded envelope join it never triggers. There is no
# measured case of it helping.
#
# Off rather than a raised jit_above_cost, though both measured the same: a threshold is a
# number that silently expires as the data grows, and the defect is that the estimate cannot be
# trusted — so stop letting it make this decision rather than moving the line it crosses.
#
# Revisit if a genuinely analytical workload appears — reporting over the full ledger, say — and
# revisit by re-running that file with KF_MEASURE_RLS=1, which will answer it again on real data
# rather than from first principles.
jit = off
