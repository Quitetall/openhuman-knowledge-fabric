# Replace example hostnames only through reviewed host configuration. Certificate must contain
# both names. This file never proxies Keycloak; issuer remains its own authority boundary.

# Per-client request budgets. This file is included at http{} level, where zones must live.
#
# Keyed on the client address nginx sees; nothing in front of nginx rewrites it. Bursts absorb
# a page that fans out a few requests at once; `nodelay` serves the burst immediately and
# refuses the excess with 429 rather than queueing it, so a flood costs the flooder, not the
# application. The budgets are deliberately generous for a person and tight for a script:
#   kf_ingest  — /ingest and document import parse and store files: 10 per minute.
#   kf_read    — /documents, /search: 10 per second sustained.
#   kf_ready   — /readiness walks the audit chain; loopback only below, and rate-bound anyway.
#   kf_login   — the web's /auth/ paths start and finish OIDC logins: 10 per minute, so
#                password guessing meets this before it meets Keycloak's lockout.
limit_req_zone $binary_remote_addr zone=kf_ingest:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kf_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=kf_ready:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=kf_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=kf_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fabric.example.internal api.fabric.example.internal;
    return 308 https://$host$request_uri;
}

# Unknown TLS hostnames complete TLS with deployment certificate, then receive no application
# response. This keeps neither web nor API as implicit default virtual host.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/kf/tls/knowledge-fabric.crt;
    ssl_certificate_key /etc/kf/tls/knowledge-fabric.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fabric.example.internal;
    # 10 MiB source plus Server Action multipart framing.
    client_max_body_size 11m;

    ssl_certificate /etc/kf/tls/knowledge-fabric.crt;
    ssl_certificate_key /etc/kf/tls/knowledge-fabric.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KF_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # The application sends the full nonce-based Content-Security-Policy (apps/web/src/proxy.ts).
    # This one is the floor for anything that leaves without it — an error page nginx itself
    # renders, or a route the proxy matcher skips. Browsers enforce both, so the stricter wins.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;
    server_tokens off;
    limit_conn kf_conn 50;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3000;
    }

    location /auth/ {
        limit_req zone=kf_login burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fabric.example.internal;
    # Matches Fastify document-import request boundary after base64 expansion.
    client_max_body_size 16m;

    ssl_certificate /etc/kf/tls/knowledge-fabric.crt;
    ssl_certificate_key /etc/kf/tls/knowledge-fabric.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KF_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    server_tokens off;
    limit_conn kf_conn 50;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    location = /ingest {
        limit_req zone=kf_ingest burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    location /documents {
        limit_req zone=kf_read burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    location = /search {
        limit_req zone=kf_read burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    # The deep readiness report walks the whole audit chain and, in full, names organizations,
    # counts and backup posture. The API already gives a forwarded caller only the bare verdict;
    # this keeps the scan itself off the public edge. Operators query 127.0.0.1:4000 directly
    # (full report) or send X-KF-Readiness-Token from this host.
    location = /readiness {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=kf_ready burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }
}
