# Replace example hostnames only through reviewed host configuration. Certificate must contain
# both names. This file never proxies Keycloak; issuer remains its own authority boundary.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fabric.example.internal api.fabric.example.internal;
    return 308 https://$host$request_uri;
}

# Unknown TLS hostnames complete TLS with deployment certificate, then receive no application
# response. This keeps neither web nor API as implicit default virtual host.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/kf/tls/knowledge-fabric.crt;
    ssl_certificate_key /etc/kf/tls/knowledge-fabric.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fabric.example.internal;
    # 10 MiB source plus Server Action multipart framing.
    client_max_body_size 11m;

    ssl_certificate /etc/kf/tls/knowledge-fabric.crt;
    ssl_certificate_key /etc/kf/tls/knowledge-fabric.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KF_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    server_tokens off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fabric.example.internal;
    # Matches Fastify document-import request boundary after base64 expansion.
    client_max_body_size 16m;

    ssl_certificate /etc/kf/tls/knowledge-fabric.crt;
    ssl_certificate_key /etc/kf/tls/knowledge-fabric.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KF_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    server_tokens off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }
}
