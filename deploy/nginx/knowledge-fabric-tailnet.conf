# The first host's proxy (ADR 0039): reachable only over the Tailscale tailnet.
#
# RENDERED, NOT EDITED. scripts/deploy/provision-host.sh replaces the two tokens below from
# /etc/kf/tailnet.env and installs the result as /etc/nginx/sites-available/knowledge-fabric.conf:
#   KF_TAILNET_ADDRESS   this host's tailnet IPv4 address (`tailscale ip -4`)
#   KF_TAILNET_HOSTNAME  this host's tailnet name, <host>.<tailnet>.ts.net
#
# Differences from the private-CA template (knowledge-fabric.conf), and only these:
#   - every `listen` names the tailnet address. Never a bare port, `0.0.0.0` or `[::]`: those are
#     every interface, the public one included. reverse_proxy_posture refuses them when
#     KF_PRIVATE_LISTEN_ADDRESSES is set, and public_exposure finds any listener that got past it.
#   - ONE name. `tailscale cert` issues a certificate for the host's tailnet name only, and a
#     tailnet name has no subdomains, so the web workbench is https://KF_TAILNET_HOSTNAME/ and the
#     API is https://KF_TAILNET_HOSTNAME:8443/ (set KF_WEB_ORIGIN and KF_API_ORIGIN to those).
#   - the certificate is the publicly trusted one `tailscale cert` writes, renewed by
#     kf-tls-renew.timer; no device has to trust a private CA.
# Everything else — loopback upstreams, TLS 1.2+, the scheme forwarded, the rate limits, the
# headers, /readiness on loopback only — is the private-CA template's, for the same reasons.
#
# To serve the tailnet's IPv6 address too, add `listen [<tailscale ip -6>]:<port> ssl;` beside
# each IPv4 listen and add that address to KF_PRIVATE_LISTEN_ADDRESSES.
#
# Keycloak is not proxied here, as in the private-CA template: the issuer is its own authority
# boundary. On this host it serves its own HTTPS on the tailnet address (docs/deployment/
# private-host.md, "First host").

limit_req_zone $binary_remote_addr zone=kf_ingest:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kf_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=kf_ready:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=kf_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=kf_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Cleartext on the tailnet redirects and never proxies.
server {
    listen KF_TAILNET_ADDRESS:80 default_server;
    server_name _;
    return 308 https://KF_TAILNET_HOSTNAME$request_uri;
}

# A request naming anything else completes TLS and gets no application response.
server {
    listen KF_TAILNET_ADDRESS:443 ssl default_server;
    listen KF_TAILNET_ADDRESS:8443 ssl default_server;
    server_name _;
    ssl_certificate /etc/kf/tls/tailnet.crt;
    ssl_certificate_key /etc/kf/tls/tailnet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

# The web workbench.
server {
    listen KF_TAILNET_ADDRESS:443 ssl;
    server_name KF_TAILNET_HOSTNAME;
    # 10 MiB source plus Server Action multipart framing.
    client_max_body_size 11m;

    ssl_certificate /etc/kf/tls/tailnet.crt;
    ssl_certificate_key /etc/kf/tls/tailnet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KF_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;
    server_tokens off;
    limit_conn kf_conn 50;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3000;
    }

    location /auth/ {
        limit_req zone=kf_login burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3000;
    }
}

# The API, on the same name and its own port.
server {
    listen KF_TAILNET_ADDRESS:8443 ssl;
    server_name KF_TAILNET_HOSTNAME;
    # Matches Fastify document-import request boundary after base64 expansion.
    client_max_body_size 16m;

    ssl_certificate /etc/kf/tls/tailnet.crt;
    ssl_certificate_key /etc/kf/tls/tailnet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KF_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    server_tokens off;
    limit_conn kf_conn 50;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    location = /ingest {
        limit_req zone=kf_ingest burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    location /documents {
        limit_req zone=kf_read burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    location = /search {
        limit_req zone=kf_read burst=40 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }

    # Loopback only; operators query 127.0.0.1:4000 directly. Through the tailnet a caller is
    # refused, as through the private-CA proxy.
    location = /readiness {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=kf_ready burst=5 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4000;
    }
}
