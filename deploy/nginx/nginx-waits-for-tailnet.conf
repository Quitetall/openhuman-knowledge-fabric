# systemd drop-in for nginx.service on a tailnet host (ADR 0039). scripts/deploy/provision-host.sh
# renders it for this host into /etc/systemd/system/nginx.service.d/kf-tailnet-address.conf.
#
# Every `listen` in knowledge-fabric-tailnet.conf names the tailnet address, and that address is
# not on the host until tailscaled has brought tailscale0 up — which it does after its own start,
# not before. At boot nginx raced it and lost: `bind() to <address>:80 failed (99: Cannot assign
# requested address)`, nginx failed, and the host came back from a reboot serving nothing
# (KF-WAR-0001 rehearsal, 2026-10-07). Binding a wildcard instead is what the template refuses, and
# `net.ipv4.ip_nonlocal_bind` would let every process on the host do the same; so nginx waits, up
# to two minutes, for exactly the address it is configured to listen on, and fails (and alerts
# nothing, being Debian's unit — kf-readiness and public_exposure notice) if it never comes.
[Unit]
Wants=tailscaled.service network-online.target
After=tailscaled.service network-online.target

[Service]
ExecStartPre=/bin/sh -c 'i=0; until /usr/sbin/ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q " inet KF_TAILNET_ADDRESS/"; do i=$$((i+1)); if [ $$i -ge 120 ]; then echo "nginx: tailscale0 never carried KF_TAILNET_ADDRESS" >&2; exit 1; fi; sleep 1; done'
