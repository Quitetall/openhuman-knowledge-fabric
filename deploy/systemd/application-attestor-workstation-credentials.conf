[Service]
Environment=
EnvironmentFile=
EnvironmentFile=/etc/kf/application-public/attestor.env
Environment=KF_SECRET_CUSTODY=systemd
UnsetEnvironment=NODE_OPTIONS NODE_PATH LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT LD_DEBUG LD_DEBUG_OUTPUT LD_PROFILE GLIBC_TUNABLES GCONV_PATH BASH_ENV ENV KF_TIMER_UNIT_DIR KF_NOW_EPOCH
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-application-attestor-credentials/current/database-url
RuntimeDirectory=
RuntimeDirectory=kf-attestor kf-attestor-work
RuntimeDirectoryMode=0710
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/node /opt/kf/scripts/deploy/application-consumer.mjs attestor
ProcSubset=all
MemorySwapMax=0
LimitCORE=0
