[Service]
Environment=
EnvironmentFile=
EnvironmentFile=/etc/kf/application-public/storage.env
Environment=KF_SECRET_CUSTODY=systemd
UnsetEnvironment=NODE_OPTIONS NODE_PATH LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT LD_DEBUG LD_DEBUG_OUTPUT LD_PROFILE GLIBC_TUNABLES GCONV_PATH BASH_ENV ENV KF_TIMER_UNIT_DIR KF_NOW_EPOCH
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-application-storage-credentials/current/database-url
LoadCredential=s3-secret-access-key:/run/kf-workstation-application-storage-credentials/current/s3-secret-access-key
LoadCredential=s3-durable-secret-access-key:/run/kf-workstation-application-storage-credentials/current/s3-durable-secret-access-key
RuntimeDirectory=
RuntimeDirectory=kf-storage-work
RuntimeDirectoryMode=0700
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/node /opt/kf/scripts/deploy/application-consumer.mjs storage
ProcSubset=all
MemorySwapMax=0
LimitCORE=0
