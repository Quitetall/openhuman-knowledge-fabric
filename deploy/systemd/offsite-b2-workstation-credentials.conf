[Service]
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-offsite-credentials/current/database-url
LoadCredential=b2-endpoint:/run/kf-workstation-b2-credentials/current/b2-endpoint
LoadCredential=b2-bucket:/run/kf-workstation-b2-credentials/current/b2-bucket
LoadCredential=b2-key-id:/run/kf-workstation-b2-credentials/current/b2-key-id
LoadCredential=b2-key:/run/kf-workstation-b2-credentials/current/b2-key
RuntimeDirectory=kf-offsite-work
RuntimeDirectoryMode=0700
Environment=KF_SECRET_CUSTODY=systemd
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/bash /opt/kf/scripts/deploy/preservation-consumer.sh offsite
LimitCORE=0
MemorySwapMax=0
