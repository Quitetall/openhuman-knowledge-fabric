[Service]
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-drill-credentials/current/database-url
LoadCredential=backup-decryption-key:/run/kf-workstation-drill-credentials/current/backup-decryption-key
LoadCredential=s3-secret-access-key:/run/kf-workstation-drill-credentials/current/s3-secret-access-key
LoadCredential=b2-endpoint:/run/kf-workstation-b2-credentials/current/b2-endpoint
LoadCredential=b2-bucket:/run/kf-workstation-b2-credentials/current/b2-bucket
LoadCredential=b2-key-id:/run/kf-workstation-drill-b2-credentials/current/b2-key-id
LoadCredential=b2-key:/run/kf-workstation-drill-b2-credentials/current/b2-key
RuntimeDirectory=kf-drill-work
RuntimeDirectoryMode=0700
StateDirectory=
Environment=KF_SECRET_CUSTODY=systemd
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/bash /opt/kf/scripts/deploy/preservation-consumer.sh drill
LimitCORE=0
MemorySwapMax=0
