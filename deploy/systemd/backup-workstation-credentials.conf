[Service]
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-backup-credentials/current/database-url
LoadCredential=preservation-signing-key:/run/kf-workstation-backup-credentials/current/preservation-signing-key
RuntimeDirectory=kf-backup-work
RuntimeDirectoryMode=0700
Environment=KF_SECRET_CUSTODY=systemd
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/bash /opt/kf/scripts/deploy/preservation-consumer.sh backup
LimitCORE=0
MemorySwapMax=0
