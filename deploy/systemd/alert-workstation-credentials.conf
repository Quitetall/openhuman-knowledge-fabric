# Optional drop-in for kf-alert@.service, replacing the encrypted-guest alternative.
[Service]
Environment=KF_ALERT_PROVIDER=ntfy-healthchecks
Environment=KF_SECRET_CUSTODY=systemd
RuntimeDirectory=kf-alert-%i
RuntimeDirectoryMode=0700
Environment=TMPDIR=/run/kf-alert-%i
MemorySwapMax=0
LimitCORE=0
ProcSubset=all
LoadCredentialEncrypted=
LoadCredential=ntfy-url:/run/kf-workstation-credentials/current/alert-ntfy-url
LoadCredential=heartbeat-url:/run/kf-workstation-credentials/current/alert-heartbeat-url
Environment=KF_ALERT_WEBHOOK_URL_FILE=%d/ntfy-url
Environment=KF_ALERT_HEARTBEAT_URL_FILE=%d/heartbeat-url
ExecStartPre=
ExecStartPre=/usr/bin/test -s %d/ntfy-url
ExecStartPre=/usr/bin/test -s %d/heartbeat-url
