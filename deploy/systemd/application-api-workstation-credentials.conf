[Service]
Environment=
EnvironmentFile=
EnvironmentFile=/etc/kf/application-public/api.env
Environment=KF_SECRET_CUSTODY=systemd
UnsetEnvironment=NODE_OPTIONS NODE_PATH LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT LD_DEBUG LD_DEBUG_OUTPUT LD_PROFILE GLIBC_TUNABLES GCONV_PATH BASH_ENV ENV KF_TIMER_UNIT_DIR KF_NOW_EPOCH
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-application-api-credentials/current/database-url
LoadCredential=s3-secret-access-key:/run/kf-workstation-application-api-credentials/current/s3-secret-access-key
LoadCredential=s3-durable-secret-access-key:/run/kf-workstation-application-api-credentials/current/s3-durable-secret-access-key
LoadCredential=readiness-token:/run/kf-workstation-application-api-credentials/current/readiness-token
LoadCredential=master-record-link-secret:/run/kf-workstation-application-api-credentials/current/master-record-link-secret
RuntimeDirectory=
RuntimeDirectory=kf-api-work
RuntimeDirectoryMode=0700
ExecStartPre=
ExecStartPre=/usr/bin/test -s /opt/kf/generated/projections/knowledge-fabric.projections.json
ExecStartPre=/bin/sh -c 'for i in $$(seq 1 50); do test -S /run/kf-attestor/attestor.sock && exit 0; sleep 0.2; done; echo "kf-attestor socket /run/kf-attestor/attestor.sock is absent" >&2; exit 1'
ExecStart=
ExecStart=/usr/bin/node /opt/kf/scripts/deploy/application-consumer.mjs api
ProcSubset=all
MemorySwapMax=0
LimitCORE=0
