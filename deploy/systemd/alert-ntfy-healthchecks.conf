# Optional drop-in for kf-alert@.service ONLY.
# Install as kf-alert@.service.d/ntfy-healthchecks.conf after encrypting the endpoints.
# These are bearer URLs, never persistent plaintext files. systemd decrypts into its private
# runtime credential directory when the unit starts. See docs/deployment/phone-alerts.md.
[Service]
Environment=KF_ALERT_PROVIDER=ntfy-healthchecks
LoadCredentialEncrypted=ntfy-url:/etc/kf/credstore.encrypted/alert-ntfy-url
LoadCredentialEncrypted=heartbeat-url:/etc/kf/credstore.encrypted/alert-heartbeat-url
Environment=KF_ALERT_WEBHOOK_URL_FILE=%d/ntfy-url
Environment=KF_ALERT_HEARTBEAT_URL_FILE=%d/heartbeat-url
# Replace the legacy plaintext endpoint precheck. The heartbeat has its own guarded drop-in.
ExecStartPre=
ExecStartPre=/usr/bin/test -s %d/ntfy-url
ExecStartPre=/usr/bin/test -s %d/heartbeat-url
