[Service]
Environment=
EnvironmentFile=
EnvironmentFile=/etc/kf/application-public/checkpoint.env
Environment=KF_SECRET_CUSTODY=systemd
UnsetEnvironment=NODE_OPTIONS NODE_PATH LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT LD_DEBUG LD_DEBUG_OUTPUT LD_PROFILE GLIBC_TUNABLES GCONV_PATH BASH_ENV ENV KF_TIMER_UNIT_DIR KF_NOW_EPOCH
LoadCredential=
LoadCredentialEncrypted=
LoadCredential=database-url:/run/kf-workstation-application-checkpoint-credentials/current/database-url
LoadCredential=checkpoint-signing-key:/run/kf-workstation-application-checkpoint-credentials/current/checkpoint-signing-key
LoadCredential=s3-secret-access-key:/run/kf-workstation-application-checkpoint-credentials/current/s3-secret-access-key
RuntimeDirectory=
RuntimeDirectory=kf-checkpoint-work
RuntimeDirectoryMode=0700
ExecStartPre=
ExecStartPre=/usr/bin/test -d /etc/kf/checkpoint-public-keys
ExecStart=
ExecStart=/usr/bin/node /opt/kf/scripts/deploy/application-consumer.mjs checkpoint
ProcSubset=all
MemorySwapMax=0
LimitCORE=0
